group = "com.huddlecommunity.native_video_player"
version = "1.0.0"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.9.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

// AGP 9+ compiles Kotlin itself (built-in Kotlin) unless the app opts out with
// android.builtInKotlin=false; only then, or on AGP 8, apply the Kotlin plugin.
// Applied through pluginManager because Flutter's check for plugins that still
// apply KGP reads `apply plugin:` lines, and would warn apps on built-in Kotlin
// about a line that never runs for them.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlin = providers.gradleProperty("android.builtInKotlin")
        .map { it.toBoolean() }
        .orElse(agpMajor >= 9)
        .get()
if (agpMajor < 9 || !builtInKotlin) {
    pluginManager.apply("org.jetbrains.kotlin.android")
}

android {
    namespace = "com.huddlecommunity.native_video_player"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }

    dependencies {
        // ExoPlayer / Media3 dependencies
        implementation("androidx.media3:media3-exoplayer:1.5.0")
        implementation("androidx.media3:media3-ui:1.5.0")
        implementation("androidx.media3:media3-exoplayer-hls:1.5.0")
        implementation("androidx.media3:media3-session:1.5.0")
        // Disk cache (SimpleCache/CacheDataSource + StandaloneDatabaseProvider).
        // Both already resolve transitively; declared because we use them directly.
        implementation("androidx.media3:media3-datasource:1.5.0")
        implementation("androidx.media3:media3-database:1.5.0")

        // Media notification style
        implementation("androidx.media:media:1.7.0")

        testImplementation("org.jetbrains.kotlin:kotlin-test-junit")
        testImplementation("org.robolectric:robolectric:4.14.1")
        testRuntimeOnly("org.junit.vintage:junit-vintage-engine:5.10.3")
        // 5.0.0's Byte Buddy cannot instrument classes on JDK 21 (the JDK
        // current Android Studio and Flutter use), so every spy fails.
        testImplementation("org.mockito:mockito-core:5.14.2")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}
