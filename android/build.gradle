group = "com.huddlecommunity.native_video_player"
version = "1.0.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.9.1")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

// Kotlin is compiled by AGP's built-in Kotlin (AGP 9+); the plugin no longer
// applies the Kotlin Gradle Plugin itself (Flutter's built-in Kotlin migration
// for plugin authors, required for AGP 10). Requires Flutter 3.44+.

android {
    namespace = "com.huddlecommunity.native_video_player"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }

    dependencies {
        // ExoPlayer / Media3 dependencies
        implementation("androidx.media3:media3-exoplayer:1.5.0")
        implementation("androidx.media3:media3-ui:1.5.0")
        implementation("androidx.media3:media3-exoplayer-hls:1.5.0")
        implementation("androidx.media3:media3-session:1.5.0")
        // Disk cache (SimpleCache/CacheDataSource + StandaloneDatabaseProvider).
        // Both already resolve transitively; declared because we use them directly.
        implementation("androidx.media3:media3-datasource:1.5.0")
        implementation("androidx.media3:media3-database:1.5.0")

        // Media notification style
        implementation("androidx.media:media:1.7.0")

        testImplementation("org.jetbrains.kotlin:kotlin-test-junit:2.1.0")
        testImplementation("org.robolectric:robolectric:4.14.1")
        testRuntimeOnly("org.junit.vintage:junit-vintage-engine:5.10.3")
        // Gradle 9 no longer puts the JUnit Platform launcher on the test
        // runtime classpath itself.
        testRuntimeOnly("org.junit.platform:junit-platform-launcher:1.10.3")
        // 5.0.0's Byte Buddy cannot instrument classes on JDK 21 (the JDK
        // current Android Studio and Flutter use), so every spy fails.
        testImplementation("org.mockito:mockito-core:5.14.2")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}
